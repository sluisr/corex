<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 14px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111418;
      color: #e2e8f0;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid #232a35;
      padding-bottom: 10px;
    }
    .logo {
      width: 24px;
      height: 24px;
      border-radius: 4px;
    }
    .title {
      font-weight: 700;
      font-size: 14px;
      color: #fff;
    }
    .version {
      font-size: 11px;
      color: #64748b;
      margin-left: auto;
    }
    .card {
      background: #1a202c;
      border: 1px solid #2d3748;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #718096;
      transition: background 0.3s;
    }
    .dot.connected {
      background: #10b981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
    }
    .dot.waiting {
      background: #f59e0b;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .meta {
      margin-top: 6px;
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
    }
    .meta span {
      color: #cbd5e1;
      font-weight: 600;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #1d4ed8;
    }
    button.secondary {
      background: #334155;
      color: #cbd5e1;
    }
    button.secondary:hover {
      background: #475569;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon-32.png" class="logo" alt="Corex">
    <div class="title">Corex Bridge</div>
    <div class="version" id="version"></div>
  </div>

  <div class="card">
    <div class="status-row">
      <div id="dot" class="dot"></div>
      <span id="status-text">Checking...</span>
    </div>
    <div class="meta" id="status-meta"></div>
  </div>

  <div class="actions">
    <button id="btn-reconnect" class="secondary">Reconnect</button>
    <button id="btn-detach" class="secondary" style="display:none;">Release tabs</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
