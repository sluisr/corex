name: Release Multiplatform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: cx
            archive_suffix: x86_64-unknown-linux-gnu.tar.gz

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: cx.exe
            archive_suffix: x86_64-pc-windows-msvc.zip

          # macOS Apple Silicon (M1/M2/M3/M4)
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: cx
            archive_suffix: aarch64-apple-darwin.tar.gz

          # Android / Termux ARM64
          - os: ubuntu-latest
            target: aarch64-linux-android
            bin_name: cx
            archive_suffix: aarch64-linux-android.tar.gz
            use_cross: true

          # macOS Intel
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: cx
            archive_suffix: x86_64-apple-darwin.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binaries (cross)
        if: matrix.use_cross
        run: cross build --release --locked --bin cx --bin corex --target ${{ matrix.target }}

      - name: Build release binaries (native cargo)
        if: "!matrix.use_cross"
        run: cargo build --release --locked --bin cx --bin corex --target ${{ matrix.target }}

      - name: Set archive name
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          fi
          echo "ARCHIVE_NAME=corex-${VERSION}-${{ matrix.archive_suffix }}" >> "$GITHUB_ENV"

      - name: Package release asset (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ env.ARCHIVE_NAME }} cx corex
          cd ../../..
          sha256sum ${{ env.ARCHIVE_NAME }} | cut -d ' ' -f 1 > ${{ env.ARCHIVE_NAME }}.sha256

      - name: Package release asset (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path target\${{ matrix.target }}\release\cx.exe,target\${{ matrix.target }}\release\corex.exe -DestinationPath ${{ env.ARCHIVE_NAME }}
          (Get-FileHash -Path ${{ env.ARCHIVE_NAME }} -Algorithm SHA256).Hash.ToLower().Trim() | Out-File -FilePath "${{ env.ARCHIVE_NAME }}.sha256" -Encoding ascii

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.5.0' }}
          files: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
