name: Release Multiplatform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          # Linux x86_64. Linked against glibc 2.17 so it runs on Debian 11+,
          # Ubuntu 20.04+ and RHEL 8+, not only on the glibc of the build host.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: cx
            archive_suffix: x86_64-unknown-linux-gnu.tar.gz
            use_zigbuild: true
            glibc_floor: "2.17"

          # Linux ARM64 (Raspberry Pi 4/5 64-bit, AWS Graviton, Hetzner ARM, Docker).
          # Same glibc 2.17 floor as x86_64, so the ARM build does not inherit the
          # glibc of the runner either.
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin_name: cx
            archive_suffix: aarch64-unknown-linux-gnu.tar.gz
            use_zigbuild: true
            glibc_floor: "2.17"

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: cx.exe
            archive_suffix: x86_64-pc-windows-msvc.zip

          # macOS Apple Silicon (M1/M2/M3/M4)
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: cx
            archive_suffix: aarch64-apple-darwin.tar.gz

          # Android / Termux ARM64
          - os: ubuntu-latest
            target: aarch64-linux-android
            bin_name: cx
            archive_suffix: aarch64-linux-android.tar.gz
            use_cross: true

          # macOS Intel
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: cx
            archive_suffix: x86_64-apple-darwin.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Set up Python (for cargo-zigbuild)
        if: matrix.use_zigbuild
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cargo-zigbuild (pins the glibc baseline)
        if: matrix.use_zigbuild
        run: pip install cargo-zigbuild ziglang

      - name: Build release binaries (zigbuild)
        if: matrix.use_zigbuild
        run: cargo zigbuild --release --locked --bin cx --bin corex --target ${{ matrix.target }}.${{ matrix.glibc_floor }}

      - name: Check the binary does not need a newer glibc
        if: matrix.use_zigbuild
        run: |
          newest=$(objdump -T target/${{ matrix.target }}/release/cx | grep -oE 'GLIBC_[0-9.]+' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "Newest glibc symbol version required: $newest (floor ${{ matrix.glibc_floor }})"
          if [ "$(printf '%s\n%s\n' "$newest" "${{ matrix.glibc_floor }}" | sort -V | tail -1)" != "${{ matrix.glibc_floor }}" ]; then
            echo "::error::cx requires GLIBC_$newest, above the ${{ matrix.glibc_floor }} floor"
            exit 1
          fi

      - name: Build release binaries (cross)
        if: matrix.use_cross
        run: cross build --release --locked --bin cx --bin corex --target ${{ matrix.target }}

      - name: Build release binaries (native cargo)
        if: "!matrix.use_cross && !matrix.use_zigbuild"
        run: cargo build --release --locked --bin cx --bin corex --target ${{ matrix.target }}

      - name: Set archive name
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          fi
          echo "ARCHIVE_NAME=corex-${VERSION}-${{ matrix.archive_suffix }}" >> "$GITHUB_ENV"

      - name: Package release asset (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ env.ARCHIVE_NAME }} cx corex
          cd ../../..
          sha256sum ${{ env.ARCHIVE_NAME }} | cut -d ' ' -f 1 > ${{ env.ARCHIVE_NAME }}.sha256

      - name: Package release asset (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path target\${{ matrix.target }}\release\cx.exe,target\${{ matrix.target }}\release\corex.exe -DestinationPath ${{ env.ARCHIVE_NAME }}
          (Get-FileHash -Path ${{ env.ARCHIVE_NAME }} -Algorithm SHA256).Hash.ToLower().Trim() | Out-File -FilePath "${{ env.ARCHIVE_NAME }}.sha256" -Encoding ascii

      # A manual run only builds and keeps the archives as workflow artifacts;
      # a release is created only for a pushed tag.
      - name: Keep build as workflow artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-package-registries:
    name: Publish to Crates.io and npm
    needs: [build-and-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Aggregate checksums and update release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Fetching checksum assets for release $TAG..."
          mkdir -p /tmp/checksums
          gh release download "$TAG" -p "*.sha256" -D /tmp/checksums
          
          export TAG
          CHANGELOG_SECTION=$(python3 -c "import sys, re, os; tag = os.environ.get('TAG', '').lstrip('v'); content = open('CHANGELOG.md').read(); m = re.search(r'## \[' + re.escape(tag) + r'\][^\n]*\n(.*?)(?=\n## \[|\Z)', content, re.DOTALL); print(m.group(1).strip()) if m else None" 2>/dev/null || true)

          if [ -n "$CHANGELOG_SECTION" ]; then
            NOTES="## Release $TAG\n\n$CHANGELOG_SECTION\n\n---\n\n### Canonical Release Checksums (SHA-256)\n\n| Platform | Archive File | SHA-256 Checksum |\n| :--- | :--- | :--- |"
          else
            NOTES="## Release $TAG\n\nHigh-performance autonomous AI terminal agent compiled in native Rust.\n\n### Canonical Release Checksums (SHA-256)\n\n| Platform | Archive File | SHA-256 Checksum |\n| :--- | :--- | :--- |"
          fi
          for file in /tmp/checksums/*.sha256; do
            filename=$(basename "$file" .sha256)
            hash=$(tr -d '[:space:]' < "$file")
            case "$filename" in
              *x86_64-unknown-linux-gnu*) plat="Linux x86_64" ;;
              *aarch64-unknown-linux-gnu*) plat="Linux ARM64" ;;
              *aarch64-apple-darwin*) plat="macOS Apple Silicon" ;;
              *x86_64-apple-darwin*) plat="macOS Intel" ;;
              *aarch64-linux-android*) plat="Android Termux" ;;
              *x86_64-pc-windows-msvc*) plat="Windows x86_64" ;;
              *) plat="Generic" ;;
            esac
            NOTES+="\n| $plat | \`$filename\` | \`$hash\` |"
          done
          
          NOTES+="\n\n---\n\n### Installation & Upgrade\n\n#### Via In-Place Self-Updater\n\`\`\`bash\ncx update\n\`\`\`\n\n#### Via npm\n\`\`\`bash\nnpm install -g @sluisr/corex\n# or run directly:\nnpx @sluisr/corex\n\`\`\`\n\n#### Pre-compiled Binary (Linux, macOS, Android Termux)\n\`\`\`bash\ncurl -fsSL https://raw.githubusercontent.com/sluisr/corex/main/install.sh | bash\n\`\`\`\n\n#### From Source via Cargo / Crates.io\n\`\`\`bash\ncargo install corex-cli --locked\n\`\`\`\n\n#### Via Nix Flake\n\`\`\`bash\nnix run github:sluisr/corex\n\`\`\`\n"

          echo -e "$NOTES" > /tmp/release_notes.md
          gh release edit "$TAG" --notes-file /tmp/release_notes.md

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to Crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          echo "Publishing workspace crates to Crates.io in topological order..."
          cargo publish -p corex-core --locked || true
          sleep 15
          cargo publish -p corex-tools --locked || true
          cargo publish -p corex-prompt --locked || true
          sleep 15
          cargo publish -p corex-fleet --locked || true
          sleep 15
          cargo publish -p corex-tui --locked || true
          sleep 15
          cargo publish -p corex-cli --locked || true

      - name: Sync npm version and publish to npm registry
        if: env.NODE_AUTH_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Synchronizing npm package version to $VERSION (tag: $GITHUB_REF_NAME)..."
          cd npm
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          sed -i "s/const VERSION = '.*';/const VERSION = '${GITHUB_REF_NAME}';/" scripts/install.js
          npm publish --access public
