[workspace]
members = [
    "crates/corex-core",
    "crates/corex-tools",
    "crates/corex-prompt",
    "crates/corex-tui",
    "crates/corex-cli",
    "crates/corex-fleet",
]
resolver = "2"

[workspace.package]
version = "0.8.2"
edition = "2021"
authors = ["sluisr <contact@sluisr.com>"]
license = "AGPL-3.0-only"
repository = "https://github.com/sluisr/corex"
homepage = "https://github.com/sluisr/corex"
readme = "README.md"

[workspace.dependencies]
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "process", "sync", "time", "signal", "io-util", "fs", "net"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
reqwest-eventsource = "0.6"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
ratatui = { version = "0.29", features = ["crossterm", "serde"] }
crossterm = { version = "0.28", features = ["event-stream"] }
similar = "2.7"
diffy = "0.4"
ignore = "0.4"
regex = "1.11"
glob = "0.3"
anyhow = "1.0"
tracing = "0.1"
colored = "3.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
directories = "5.0"
async-trait = "0.1"
base64 = "0.22"
htmd = { version = "0.5", default-features = false }
clap_complete = "4.5"
sha2 = "0.10"
flate2 = "1.0"
tar = "0.4"
zip = { version = "9.1", default-features = false, features = ["deflate-flate2"] }
toml = "0.8"

# Internal crates
corex-core = { path = "crates/corex-core", version = "0.8.2" }
corex-tools = { path = "crates/corex-tools", version = "0.8.2" }
corex-prompt = { path = "crates/corex-prompt", version = "0.8.2" }
corex-tui = { path = "crates/corex-tui", version = "0.8.2" }
corex-fleet = { path = "crates/corex-fleet", version = "0.8.2" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

